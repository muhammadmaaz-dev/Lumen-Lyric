name: musicapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  just_audio: ^0.10.5
  marquee: ^2.3.0
  audio_video_progress_bar: ^2.0.3
  lottie: ^3.3.2
  permission_handler: ^12.0.1
  on_audio_query: ^2.9.0
  provider: ^6.1.5+1
  flutter_audio_tagger: ^5.1.1
  flutter_riverpod: ^3.0.3
  shared_preferences: ^2.5.4
  interactive_slider: ^0.5.1
  flutter_animate: ^4.5.2
  miniplayer: ^1.0.1
  cupertino_modal_sheet: ^1.1.0
  modal_bottom_sheet: ^3.0.0
  url_launcher: ^6.3.2
  http: ^1.6.0
  dio: ^5.9.0
  
  # For HTTP requests & file downloads
  # For getting app directories
  path_provider: ^2.1.5
  
  # For generating unique IDs
  uuid: ^4.2.1
  
  # For image caching (thumbnails)
  cached_network_image: ^3.4.1
  toastification: ^3.0.3
  just_audio_background: ^0.0.1-beta.17
  youtube_explode_dart: ^3.0.5
  shimmer: ^3.0.0
  fluttertoast: ^9.0.0
  flutter_downloader: ^1.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.13.1"

# ✅ Yahan indentation theek ki hai:
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/6.jpg
    - assets/icon/google.png
    - assets/logo/lines.png
    - assets/logo/logo.png
    - assets/animation/Astornaut-Music.json
    - assets/animation/Astornaut-White.json

  fonts:
    - family: SNPro
      fonts:
        - asset: assets/fonts/SNPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/SNPro-Black.ttf
          weight: 900
    - family: Metropolis
      fonts:
        - asset: assets/fonts/Metropolis-Medium.otf
          weight: 400
        - asset: assets/fonts/Metropolis-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Metropolis-Bold.otf
          weight: 700
        - asset: assets/fonts/Metropolis-ExtraBold.otf
          weight: 800